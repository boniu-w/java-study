x-common-variables: &env-variables
  NACOS_SERVER_ADDR: nacos1:8848,nacos2:8848,nacos3:8848
  NACOS_NAMESPACE: 342627f7-f775-4cac-b180-c1f36f8ecad3
  NACOS_USERNAME: nacos
  NACOS_PASSWORD: pnC^bEbcVBB7
  SPRING_PROFILES_ACTIVE: dev
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: 192.168.100.18:11800
  JAVA_TOOL_OPTIONS: "-javaagent:/opt/skywalking-agent/skywalking-agent.jar"
